name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # ship the latest retire.js advisories; the tests below run against them. A failed download keeps
      # the copy in the repository.
      - name: Refresh library advisories (retire.js)
        run: |
          node tools/update-vulndb.mjs || echo "::warning::Could not refresh the advisory data; shipping the bundled copy"
          git diff --stat -- src/vulndb.js

      - name: Run tests
        run: |
          node test/run-tests.mjs
          node test/sw-harness.mjs

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(node -p "require('./manifest.json').version")"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG manifest=$MANIFEST package=$PKG"
          if [ "$PKG" != "$MANIFEST" ]; then
            echo "::error::package.json version $PKG does not match manifest version $MANIFEST"
            exit 1
          fi
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag v$TAG does not match manifest version $MANIFEST"
            exit 1
          fi

      - name: Package extension
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="js-recon-${VERSION}.zip"
          # Ship only what the extension loads at runtime (no tests, assets, docs or git metadata).
          zip -r -9 "$ZIP" manifest.json icons fonts src ui \
            -x '*/.DS_Store' '*/Thumbs.db'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP"

      # same code, Firefox manifest (background.scripts, gecko id, options_ui): see tools/build-firefox.mjs
      - name: Package Firefox build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FFZIP="js-recon-firefox-${VERSION}.zip"
          node tools/build-firefox.mjs --zip "$FFZIP"
          echo "FFZIP=$FFZIP" >> "$GITHUB_ENV"
          unzip -l "$FFZIP"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$FFZIP" \
            --title "JS Recon $GITHUB_REF_NAME" \
            --generate-notes
