name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Analyzer + rules suite
        run: node test/run-tests.mjs

      - name: Service-worker harness
        run: node test/sw-harness.mjs

      - name: Syntax-check all sources
        run: |
          set -e
          for f in src/*.js ui/*.js; do node --check "$f"; done

      - name: Validate manifest.json
        run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) throw new Error('manifest_version must be 3'); if(!/^\d+\.\d+\.\d+$/.test(m.version)) throw new Error('bad version '+m.version); console.log('manifest OK v'+m.version)"
